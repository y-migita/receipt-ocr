<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>📊 AI OCR結果比較</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-2 h-screen overflow-hidden">
  <div class="flex justify-between items-center mb-2">
    <h1 class="text-lg font-bold">📊 AI OCR結果比較</h1>
    <div class="text-xs flex gap-3">
      <span class="text-gray-400 border px-1 bg-gray-100 rounded-full">null</span>=情報なし
      <span class="text-red-400 border px-1 bg-red-100 rounded-full">undefined</span>=エラー
    </div>
  </div>
  <table class="w-full bg-white rounded shadow text-xs" id="t"></table>
  <script>
    fetch('/output/results.json').then(r => r.json()).then(data => {
      const models = [...new Set(data.map(d => d.model))];
      const images = [...new Set(data.map(d => d.image))];
      const keys = ['issue_date', 'supplier_name', 'total_amount'];
      const get = (m, img, k) => data.find(x => x.model === m && x.image === img)?.data?.[k];
      const fmt = (v, k) => v === undefined ? '<span class="text-red-400 border px-1 bg-red-100 rounded-full">undefined</span>'
        : v === null ? '<span class="text-gray-400 border px-1 bg-gray-100 rounded-full">null</span>'
          : k === 'total_amount' ? '¥' + v.toLocaleString() : v;

      document.getElementById('t').innerHTML = `
        <tr class="bg-gray-100">
          <th class="p-2" colspan="2"></th>
          ${images.map(img => `<th class="p-2"><img src="/input/${img}" class="h-32 mx-auto rounded"></th>`).join('')}
        </tr>
        <tr class="bg-gray-100 text-gray-600 border-b border-gray-300">
          <th class="p-2" colspan="2"></th>
          ${images.map(img => `<th class="p-2">${img}</th>`).join('')}
        </tr>
        ${models.map((m, mi) => keys.map((k, i) => `
          <tr class="${i === 2 && mi < models.length - 1 ? 'border-b-4 border-gray-200' : 'border-b'}">
            ${i === 0 ? `<td class="p-2 font-medium bg-gray-50" rowspan="3">${m.split('/')[1]}</td>` : ''}
            <td class="p-1 bg-gray-50">${['📅発行日', '🏪支払先', '💰金額'][i]}</td>
            ${images.map(img => `<td class="p-2">${fmt(get(m, img, k), k)}</td>`).join('')}
          </tr>
        `).join('')).join('')}
      `;
    });
  </script>
</body>

</html>
